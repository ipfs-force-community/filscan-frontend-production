# ============================================================
# Filscan Nginx 反代 + 防 DOS 配置
# 部署位置：/etc/nginx/conf.d/filscan.conf
# 架构：ALB -> Nginx(9090) -> Next.js(127.0.0.1:3000)
# ============================================================

# ★★★ 必改项 ★★★
# ALB 在 Nginx 前面，必须让 Nginx 从 X-Forwarded-For 恢复真实客户端 IP，
# 否则所有访问者都会被视为 ALB 的 IP，限流将把全体用户当成一个 IP 误伤。
# 将下面的 CIDR 替换为 ALB 所在 VPC 网段（或 ALB 的私网 IP），可写多行。
set_real_ip_from 10.0.0.0/8;   # TODO: 改成 ALB 所在 VPC CIDR
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 9090;
    server_name _;
    server_tokens off;

    # ---------- 基础安全 & 超时（防慢速攻击 / slowloris） ----------
    client_max_body_size 1m;             # 拒绝超大请求体
    client_body_timeout 10s;             # 读取 body 超时
    client_header_timeout 10s;           # 读取 header 超时
    large_client_header_buffers 4 16k;   # 防止超大 header
    send_timeout 10s;                    # 发送响应超时
    keepalive_timeout 65s;
    reset_timedout_connection on;

    # 记录限流触发事件（"limiting requests"），供 fail2ban 匹配后自动封禁 IP
    error_log /var/log/nginx/filscan-limit.log notice;

    # ---------- 压缩（节省带宽） ----------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/xml application/xml+rss image/svg+xml;

    # ---------- 请求方法白名单 ----------
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
        return 405;
    }

    # ---------- 拦截常见恶意路径 ----------
    location ~* \.(php|asp|aspx|jsp|sh|pl|cgi)$ {
        return 403;
    }
    location ~* /(\.git|\.env|wp-admin|wp-login|admin\.php|\.\./) {
        return 403;
    }

    # ---------- 静态资源：三层限速 + 带宽限制 + 浏览器缓存 ----------
    location ~* \.(css|js|mjs|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|mp4|webm)$ {
        limit_req zone=req_ip burst=200 nodelay;     # 第一层：单 IP 总量（10 r/s）
        limit_req zone=req_ip_uri burst=5 nodelay;   # 第二层：IP+URL（1 r/s）
        limit_req zone=req_uri burst=100 nodelay;    # 第三层：全局单 URL（分布式兜底，10 r/s）
        limit_conn conn_per_ip 100;
        limit_rate_after 2m;   # 前 2MB 不限速，正常页面加载不受影响
        limit_rate 10m;        # 单连接下载带宽上限，防止持续拖带宽
        expires 7d;
        add_header Cache-Control "public";
        access_log off;

        # 加大代理缓冲（默认 8×8k=64KB，大图片会落盘到临时文件）
        # 64×16k=1MB，覆盖绝大多数图片/JS 资源，减少磁盘 IO
        proxy_buffer_size 16k;
        proxy_buffers 64 16k;
        proxy_busy_buffers_size 64k;
        proxy_temp_file_write_size 64k;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 主应用反代（两层限流） ----------
    location / {
        limit_req zone=req_ip burst=50 nodelay;      # 第一层：单 IP 总量（10 r/s）
        limit_req zone=req_ip_uri burst=5 nodelay;   # 第二层：IP+URL（1 r/s）
        limit_conn conn_per_ip 30;
        limit_conn conn_backend 20;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }
}
