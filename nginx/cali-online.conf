# ============================================================
# calibration.filscan.io 线上 Nginx 配置（54.178.21.220）
# 相对原配置仅修改两处：
#   1. 前端(443) server 的静态资源 location：本地 root -> 反代应用
#      （修复新构建 chunk 404：HTML 走反代是新版，静态却读旧目录）
#   2. 前端(443) server 增加三层限流（与主网一致）
# 其余 server 块（80 跳转 / 8081 / 81 / 82 / 8700 / api-cali）原样保留
# ============================================================

# 三层限流 zone 定义（http 上下文）。
# 若 nginx.conf 或其他 conf 已定义同名 zone 会报 duplicate，删除对应行即可
limit_req_zone $binary_remote_addr zone=req_ip:20m rate=10r/s;   # 第一层：单 IP
limit_req_zone $binary_remote_addr$uri zone=req_ip_uri:20m rate=1r/s;  # 第二层：IP+URL
limit_req_zone $uri zone=req_uri:20m rate=5r/s;                 # 第三层：全局单 URL

# 限流超限统一返回 429（默认是 503）
limit_req_status 429;
limit_conn_status 429;

server {
        listen   443 ssl;
        server_name calibration.filscan.io;
        charset     utf-8;
        autoindex on;
        ssl_certificate  /etc/nginx/cert/calibration.filscan.io.pem;
        ssl_certificate_key  /etc/nginx/cert/calibration.filscan.io.key;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        server_tokens off;
        fastcgi_param   HTTPS   on;
        fastcgi_param   HTTP_SCHEME   https;
        location /{
                proxy_redirect off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_pass http://172.31.33.238:9092;
                #limit_req zone=all burst=50 nodelay;
                #limit_conn addr 10;
              #root /home/filscan/weihu;
              #root /home/filscan-test/frontend/cacode/code;

              #rewrite ^.+(?<!js|css|png|map)$ /index.html break;

              # —— 新增：三层限流（与主网一致）——
              limit_req zone=req_ip burst=50 nodelay;
              limit_req zone=req_ip_uri burst=5 nodelay;
        }
        #root /home/filscan/weihu;
        location ~ \.(js|html|css|gif|jpg|png|ico|json|ttf|gzip__|woff2|gz|mp3|jpeg|bmp|swf|svg)$ {
              # —— 修改：本地 root 改为反代应用（修复新构建 chunk 404）——
              proxy_redirect off;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_pass http://172.31.33.238:9092;
              # —— 新增：静态资源三层限流（与主网一致）——
              limit_req zone=req_ip burst=200 nodelay;
              limit_req zone=req_ip_uri burst=5 nodelay;
              limit_req zone=req_uri burst=100 nodelay;
              #root /home/filscan-test/frontend/cacode/code;
        }
}

# ===== 以下 server 块原样保留，未做任何修改 =====

server {
    listen 80;
    server_name calibration.filscan.io;
            location /{
                proxy_redirect off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                #root /home/filscan/fronted/code;
                #rewrite ^.+(?<!js|css|png|map)$ /index.html break;
                }
        #root   /home/filscan/weihu;
        rewrite ^/(.*)$ https://calibration.filscan.io  permanent;
}
server {
    listen 8081;
    #server_name calibration.filscan.io;
            location /{
                proxy_redirect off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                root /home/wallet_new/web;
                rewrite ^.+(?<!js|css|png|map)$ /index.html break;
                }
        #rewrite ^/(.*)$ https://calibration.filscan.io  permanent;
}

server {
        listen 81;
        location /ngx_status {
            stub_status on;
            access_log off;
        }
}
server {
    listen 82;
    #server_name ipfsforce.com;
            location /{
                proxy_redirect off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                root /opt/openresty/nginx/fic/dist;
                rewrite ^.+(?<!js|css|png|map)$ /index.html break;
                }
        location ~ \.(js|html|css|gif|jpg|png|ico|json|ttf|gzip__|woff2|gz|mp3|jpeg|bmp|swf|svg)$ {
              root /opt/openresty/nginx/fic/dist;
        }
        #rewrite ^/(.*)$ https://calibration.filscan.io  permanent;
}

server {
        listen 8700 ssl;
        server_name calibration.filscan.io;
        charset     utf-8;
        autoindex on;

        ssl_certificate  /etc/nginx/cert/calibration.filscan.io.pem;
        ssl_certificate_key  /etc/nginx/cert/calibration.filscan.io.key;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        server_tokens off;
        fastcgi_param   HTTPS   on;
        fastcgi_param   HTTP_SCHEME   https;
            location /{
               limit_req zone=all burst=15 nodelay;
               limit_conn addr 10;

                proxy_redirect off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_pass http://172.31.33.238:27000;
        }
}

server {
        listen 443 ssl;
        server_name api-cali.filscan.io;
        charset     utf-8;
        autoindex on;

        ssl_certificate  /etc/nginx/cert/api-cali.filscan.io.pem;
        ssl_certificate_key  /etc/nginx/cert/api-cali.filscan.io.key;
        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        server_tokens off;
        fastcgi_param   HTTPS   on;
        fastcgi_param   HTTP_SCHEME   https;
            location /{
               limit_req zone=all burst=15 nodelay;
               limit_conn addr 10;

                proxy_redirect off;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_pass http://172.31.33.238:27000;
        }
}
