# ============================================================
# 主网入口共享反代规则（由 conf.d/filscan-edge.conf 的 443 块 include）
# 与替换前的 ALB 行为逐字对齐：
#   /api/v1/*、/pro/v1/* → 主网后端 172.31.34.109:27000
#   其余                 → 本机 9090 反代块（三层限流/防 DOS 原样保留）
# 说明：XFF 用 $remote_addr 覆盖写入，客户端自带的 XFF 一律丢弃（防伪造）；
#       对后端的 X-Forwarded-Proto 保持 https（与 ALB TLS 监听器一致）
# ============================================================
location ^~ /api/v1/ {
    proxy_pass http://172.31.34.109:27000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    client_max_body_size 25m;          # 合约验证页允许 20M 上传，不能让 nginx 默认 1m 卡住
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
}
location ^~ /pro/v1/ {
    proxy_pass http://172.31.34.109:27000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    client_max_body_size 25m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
}
location / {
    proxy_pass http://127.0.0.1:9090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
}
