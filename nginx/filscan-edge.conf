# ============================================================
# 主网入口（2026-10-01 起）：DNS 直连本机，替换原来的 ALB(+NLB)
#   80：同 host 跳 https；同时提供 Let's Encrypt 续期校验目录（HTTP-01）
#   443：Let's Encrypt 证书一张覆盖 filscan.io/www/www.api-v2 之外的 4 个域名，
#        按路径分流（见 snippets/filscan-edge-proxy.conf）
# 注意：本块占用 80/443 的 default_server，Ubuntu 默认站点 sites-enabled/default
#       必须删除，否则 nginx -t 报 duplicate default server
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/edge-access.log;   # 入口层单独记账，避免与 9090 层重复计数

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name filscan.io www.filscan.io m.filscan.io api-v2.filscan.io _;
    server_tokens off;
    access_log /var/log/nginx/edge-access.log;   # 入口层：页面 + 新增可见的 API 流量

    ssl_certificate     /etc/letsencrypt/live/filscan.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/filscan.io/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;   # 与 ALB 现行安全策略对齐（收紧属后续独立变更）

    include /etc/nginx/snippets/filscan-edge-proxy.conf;
}
