# ============================================================
# Filscan 防 DOS 限流 Zone 定义（http 上下文）
# 部署位置：/etc/nginx/conf.d/anti-dos-limits.conf
# 前提：nginx.conf 已 include /etc/nginx/conf.d/*.conf
# 与 filscan.conf 配合使用
# ============================================================
# 两层限流设计：
#   第一层 req_ip     ：单 IP 总速率限制，防单 IP 高频请求（CC）
#   第二层 req_ip_uri ：IP + URL 组合限制，防单 IP 持续刷同一 URL
#                       （同一 IP 对同一 URL 每秒最多 1 次）

# ---------- 第一层：单 IP 请求速率限制 ----------
limit_req_zone $binary_remote_addr zone=req_ip:20m rate=10r/s;

# ---------- 第二层：IP + URL 组合请求速率限制 ----------
limit_req_zone $binary_remote_addr$uri zone=req_ip_uri:20m rate=1r/s;

# ---------- 第三层：全局单 URL 限速（分布式多 IP 刷同一 URL 时启用） ----------
# 按整个 URL 计数，不区分 IP：无论多少 IP 来刷，同一 URL 每秒总量不超过 rate
# ⚠️ 注意：正常用户也共享这个配额，误伤风险高；仅建议用于静态资源 location
limit_req_zone $uri zone=req_uri:20m rate=5r/s;

# ---------- 每 IP 并发连接数限制（防连接耗尽） ----------
limit_conn_zone $binary_remote_addr zone=conn_per_ip:20m;

# ---------- 每 IP 到后端的同时连接数限制 ----------
limit_conn_zone $binary_remote_addr zone=conn_backend:20m;

# 超限统一返回 429（Too Many Requests）
limit_req_status 429;
limit_conn_status 429;
